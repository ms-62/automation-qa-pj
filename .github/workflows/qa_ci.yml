name: Automation QA CI

# 트리거 설정: demo 브랜치에 push나 PR이 발생할 때 실행
on:
  push:
    branches: [ "demo" ]
  pull_request:
    branches: [ "demo" ]

jobs:
  test:
    runs-on: ubuntu-latest  # 실행 환경 (Linux)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # 코드 가져오기

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # 프로젝트 파이썬 버전

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb  # 가상 디스플레이 서버 설치 [web:189]
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        env:
          DISPLAY: :99
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pytest tests/ --junitxml=results.xml

      # 테스트 실패 시에만 스크린샷 및 로그 업로드
      - name: Upload Screenshot on Failure
        if: failure()  # 앞선 테스트 단계가 실패했을 때만 실행 [web:141]
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: |
            reports/screenshots/*.png
            reports/logs/*.log
          retention-days: 7  # 7일 동안 보관 [web:210]

      - name: Upload Test Results
        if: always()  # 테스트 실패 시에도 업로드
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results.xml
